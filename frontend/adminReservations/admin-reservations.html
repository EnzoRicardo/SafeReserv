<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeReserve | Reservas</title>

  <link rel="stylesheet" href="../adminDashboard/admin-dashboard.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
</head>
<body>
  <main class="dashboard-page">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <span>SafeReserve</span>
      </div>

      <nav class="sidebar-nav">
        <a href="../adminDashboard/admin-dashboard.html">
          <i class="fa-solid fa-chart-line"></i>
          Dashboard
        </a>

        <a href="../adminRooms/admin-rooms.html">
          <i class="fa-solid fa-door-open"></i>
          Gerenciar salas
        </a>

        <a href="#" class="active">
          <i class="fa-solid fa-calendar-check"></i>
          Reservas
        </a>

        <a href="../adminLogs/admin-logs.html">
          <i class="fa-solid fa-file-shield"></i>
          Logs
        </a>
      </nav>

      <button class="logout-btn">
        <i class="fa-solid fa-right-from-bracket"></i>
        Sair
      </button>
    </aside>

    <section class="content">
      <header class="topbar">
        <div>
          <span class="page-label">Administração</span>
          <h1>Reservas do sistema</h1>
          <p>Lista carregada em tempo real da API.</p>
        </div>

        <div class="user-box">
          <div class="user-avatar">
            <i class="fa-solid fa-user-shield"></i>
          </div>

          <div>
            <strong>Administrador</strong>
            <span>admin@safereserve.com</span>
          </div>
        </div>
      </header>

      <section class="summary-grid">
        <article class="summary-card">
          <div class="summary-icon">
            <i class="fa-solid fa-calendar-check"></i>
          </div>
          <div>
            <span>Total</span>
            <strong id="totalCount">0</strong>
          </div>
        </article>

        <article class="summary-card">
          <div class="summary-icon">
            <i class="fa-solid fa-circle-check"></i>
          </div>
          <div>
            <span>Aprovadas</span>
            <strong id="approvedCount">0</strong>
          </div>
        </article>

        <article class="summary-card">
          <div class="summary-icon">
            <i class="fa-solid fa-hourglass-half"></i>
          </div>
          <div>
            <span>Pendentes</span>
            <strong id="pendingCount">0</strong>
          </div>
        </article>

        <article class="summary-card">
          <div class="summary-icon">
            <i class="fa-solid fa-ban"></i>
          </div>
          <div>
            <span>Canceladas</span>
            <strong id="cancelledCount">0</strong>
          </div>
        </article>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div>
            <h2>Todas as reservas</h2>
            <p>Dados persistidos no PostgreSQL via backend Django.</p>
          </div>
        </div>

        <p class="form-message" id="pageMessage"></p>
        <div class="reservations-list" id="reservationsList"></div>
      </section>
    </section>
  </main>

  <script src="../shared/app.js"></script>
  <script src="admin-reservations.js"></script>
</body>
</html>
